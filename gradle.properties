org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# minSdk 33 大於 targetSdk 22 是刻意的設計：targetSdk 必須固定為 22 才能寫入
# 非公開的 Settings.System key（見 app/build.gradle.kts 的說明），所以抑制這條警告。
# UNSUPPORTED_PROJECT_OPTION_USE 是 AGP 對「使用了這個抑制選項」本身發出的提醒，一併抑制。
android.sync.suppressAgpWarnings=MIN_SDK_VERSION_GREATER_THAN_TARGET_SDK,UNSUPPORTED_PROJECT_OPTION_USE
