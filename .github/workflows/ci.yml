# 每次推送到 main 與每個 pull request：單元測試、lint，並建置 debug APK。
# release 簽章只在維護者的電腦上進行，CI 不接觸金鑰。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 也會驗證 gradle-wrapper.jar 是官方版本。
      - uses: gradle/actions/setup-gradle@v4

      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintRelease assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
