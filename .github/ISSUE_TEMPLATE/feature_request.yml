name: 功能建議 / Feature request
description: 建議新功能或改進 / Suggest a new feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解決什麼問題 / What problem does it solve
      description: 描述你遇到的情況，而不只是想要的功能。/ Describe the situation you're in, not just the feature you want.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建議的做法 / Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: 其他考慮過的做法 / Alternatives considered
